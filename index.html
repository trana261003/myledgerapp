<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ledger Manager</title>

    <script src="./cdn/lottie.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", Arial, sans-serif;
            background: linear-gradient(135deg, #007bff, #6dc4ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Splash Screen */
        #splashScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Loader Overlay */
        #submitLoader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: 9998;
            display: none;
            justify-content: center;
            align-items: center;
        }

        /* Login Box */
        .login-box {
            width: 350px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 26px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 6px rgba(0, 123, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
            color: red;
        }
    </style>
</head>

<body>

    <!-- Splash Screen -->
    <div id="splashScreen">
        <div id="lottie-animation" style="width: 300px; height: 300px;"></div>
    </div>

    <!-- Submit Loader -->
    <div id="submitLoader">
        <div id="submit-animation" style="width: 200px; height: 200px;"></div>
    </div>

    <!-- Login Form -->
    <div class="login-box">
        <h2>🔐 Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <p id="message"></p>
    </div>

<script>
/* ---------------- SPLASH SCREEN ---------------- */
document.addEventListener("DOMContentLoaded", () => {
    const splash = document.getElementById("splashScreen");
    const splashSeen = sessionStorage.getItem("splashSeen");

    if (!splashSeen) {
        lottie.loadAnimation({
            container: document.getElementById('lottie-animation'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'animations/Sandy Loading.json'
        });

        setTimeout(() => {
            splash.style.display = "none";
            sessionStorage.setItem("splashSeen", "true");
        }, 2500);
    } else {
        splash.style.display = "none";
    }
});

/* ---------------- LOGIN FUNCTION ---------------- */
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");
    const loader = document.getElementById("submitLoader");

    message.textContent = "";
    loader.style.display = "flex";

    try {
        const res = await fetch("https://myledgerappbackend.onrender.com/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
            loader.style.display = "none";
            message.textContent = data.msg || "Login failed";
            return;
        }

        localStorage.setItem("token", data.token);

        // redirect after slight delay
        setTimeout(() => {
            window.location.href = "home.html";
        }, 300);

    } catch (err) {
        loader.style.display = "none";
        message.textContent = "Something went wrong";
    }
});
</script>

</body>
</html>
